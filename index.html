<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Life Prep - Preps</title>
    <link rel="stylesheet" href="styles.css">

</head>


<body>

    <div class="page-shell">

    <h1>Life Prep</h1>

    <nav>
        <a href="index.html"><b>Preps</b></a>
        <a href="materials.html">Materials</a>
        <a href="steps.html">Steps</a>
    </nav>


    <!-- ================================ -->
    <!-- INSERT -->
    <!-- ================================ -->

    <h2>Add Prep</h2>

    <input
        type="text"
        id="title"
        placeholder="Title (e.g. Go-bag)"
    >

    <select id="category">
        <option>Typhoon &amp; Flood</option>
        <option>Power &amp; Water</option>
        <option>Health &amp; First Aid</option>
        <option>Home Safety</option>
        <option>Other</option>
    </select>

    <input
        type="text"
        id="description"
        placeholder="Description"
    >

    <input
        type="text"
        id="source"
        placeholder="Source (link or page name)"
    >

    <button onclick="addPrep()">
        Add Prep
    </button>


    <!-- ================================ -->
    <!-- RETRIEVE -->
    <!-- ================================ -->

    <h2>Preps</h2>

    <button onclick="loadPreps()">
        Load Preps
    </button>


    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Category</th>
                <th>Description</th>
                <th>Source</th>
            </tr>

        </thead>

        <tbody id="prepTable">

        </tbody>

    </table>


    <script>

        function showPopup(message) {
            alert(message);
        }


        // Make text safe to show inside HTML
        function esc(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        // ========================================
        // GET - Retrieve Preps
        // ========================================

        async function loadPreps() {

            const response =
                await fetch("/api/preps");


            const preps =
                await response.json();


            const table =
                document.getElementById(
                    "prepTable"
                );


            table.innerHTML = "";


            preps.forEach(prep => {

                const row = `
                    <tr>

                        <td>${prep.id}</td>

                        <td>${esc(prep.title)}</td>

                        <td>${esc(prep.category)}</td>

                        <td>${esc(prep.description)}</td>

                        <td>${esc(prep.source)}</td>

                    </tr>
                `;

                table.innerHTML += row;

            });

        }


        // ========================================
        // POST - Insert Prep
        // ========================================

        async function addPrep() {

            const prep = {

                title:
                    document.getElementById("title").value,

                category:
                    document.getElementById("category").value,

                description:
                    document.getElementById("description").value,

                source:
                    document.getElementById("source").value

            };


            const response =
                await fetch(
                    "/api/preps",
                    {

                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(prep)

                    }
                );


            const result =
                await response.json();


            showPopup(result.message);


            if (response.ok) {

                // Clear inputs

                document.getElementById("title").value = "";

                document.getElementById("description").value = "";

                document.getElementById("source").value = "";


                // Refresh list

                loadPreps();

            }

        }


        // Load preps when page opens
        loadPreps();

    </script>

    </div>

</body>

</html>
